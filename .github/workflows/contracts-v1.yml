name: Federation V3 Contracts

on:
  push:
    paths:
      - 'schemas/**'
      - 'contracts/**'
      - 'config/contract_*.json'
      - 'config/flow_registry_v1.json'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/contracts-v1.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'contracts/**'
      - 'config/contract_*.json'
      - 'config/flow_registry_v1.json'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/contracts-v1.yml'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Validate Federation V3 contracts
        run: pytest -q tests
