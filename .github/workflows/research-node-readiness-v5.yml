name: Research Node Readiness v5

on:
  pull_request:
    paths:
      - 'evidence/research_compute_node_self_digest_negative_evidence_v1.json'
      - 'fixtures/build_inputs/**'
      - 'fixtures/build_recipes/agi_nexus_build_recipe_v4.json'
      - 'fixtures/build_evidence/agi_nexus_build_evidence_v2.json'
      - 'fixtures/artifact_runtime_specs/agi_nexus_artifact_runtime_spec_v2.json'
      - 'fixtures/artifact_location_evidence/**'
      - 'fixtures/negative_evidence/agi_nexus_reconstruction_drift_v2.json'
      - 'fixtures/artifact_sets/*_v3.json'
      - 'fixtures/node_build_plans/*_v6.json'
      - 'fixtures/node_readiness/*_v5.json'
      - 'src/synergy_system/node_readiness_v5.py'
      - 'tests/test_node_readiness_v5.py'
      - '.github/workflows/research-node-readiness-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_node_readiness_v4.py tests/test_node_readiness_v5.py
