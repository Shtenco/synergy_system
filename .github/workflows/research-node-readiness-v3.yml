name: Research Node Readiness v3

on:
  pull_request:
    paths:
      - 'fixtures/service_specs/agi_nexus_service_spec_v2.json'
      - 'fixtures/build_recipes/agi_nexus_build_recipe_v2.json'
      - 'fixtures/node_source_revisions/research_compute_node_nexus_proof_core_v2.json'
      - 'fixtures/node_build_plans/research_compute_node_build_plan_all_interfaces_v3.json'
      - 'fixtures/node_readiness/research_compute_node_readiness_v3.json'
      - 'src/synergy_system/node_readiness_v3.py'
      - 'tests/test_research_node_readiness_v3.py'
      - 'config/cross_repo_schema_overlay_node_readiness_v3.json'
      - 'docs/RESEARCH_NODE_READINESS_V3.md'
      - '.github/workflows/research-node-readiness-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_research_node_readiness_v3.py
