name: live-economic-cycle-capture-v1

on:
  pull_request:
    paths:
      - 'src/synergy_system/live_economic_cycle_capture_v1.py'
      - 'schemas/live_economic_cycle_capture_candidate_v1.schema.json'
      - 'tests/test_live_economic_cycle_capture_v1.py'
      - 'docs/LIVE_ECONOMIC_CYCLE_CAPTURE_V1_20260828.md'
      - '.github/workflows/live-economic-cycle-capture-v1.yml'
  workflow_dispatch:

jobs:
  capture-contract-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_live_economic_cycle_capture_v1.py
