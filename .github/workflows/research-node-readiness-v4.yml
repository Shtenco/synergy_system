name: Research Node Readiness v4

on:
  pull_request:
    paths:
      - 'config/build_toolchain_lock_v1.json'
      - 'fixtures/build_evidence/**'
      - 'fixtures/build_recipes/*_v3.json'
      - 'fixtures/artifact_runtime_specs/**'
      - 'fixtures/node_build_plans/*_v4.json'
      - 'fixtures/node_readiness/*_v4.json'
      - 'src/synergy_system/node_readiness_v4.py'
      - 'tests/test_node_readiness_v4.py'
      - '.github/workflows/research-node-readiness-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_node_readiness_v4.py
