name: Validate SYNERGY Federation

on:
  push:
    paths:
      - "registry/SYNERGY_REPOSITORIES.json"
      - "config/repository_federation_v2.yaml"
      - "docs/SYNERGY_REPOSITORY_ATLAS.md"
      - "docs/MASTER_ARCHITECTURE_V4.md"
      - "scripts/validate_federation.py"
      - ".github/workflows/validate-federation.yml"
  pull_request:
    paths:
      - "registry/SYNERGY_REPOSITORIES.json"
      - "config/repository_federation_v2.yaml"
      - "docs/SYNERGY_REPOSITORY_ATLAS.md"
      - "docs/MASTER_ARCHITECTURE_V4.md"
      - "scripts/validate_federation.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate federation registry
        run: python scripts/validate_federation.py
