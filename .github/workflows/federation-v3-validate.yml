name: Federation V3 Validate

on:
  push:
    paths:
      - 'config/repository_federation_v3.yaml'
      - 'scripts/validate_federation_v3.py'
      - '.github/workflows/federation-v3-validate.yml'
  pull_request:
    paths:
      - 'config/repository_federation_v3.yaml'
      - 'scripts/validate_federation_v3.py'
      - '.github/workflows/federation-v3-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate Federation V3
        run: python scripts/validate_federation_v3.py
