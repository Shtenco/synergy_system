name: Science Node Build Lock v3

on:
  pull_request:
    paths:
      - 'fixtures/node_build_locks/science_research_node_source_candidate_v3.json'
      - 'src/synergy_system/node_build_lock_v3.py'
      - 'schemas/synergy_node_build_lock_v3.schema.json'
      - 'config/cross_repo_schema_overlay_node_build_lock_v3.json'
      - 'tests/test_science_node_build_lock_v3.py'
      - 'docs/SCIENCE_NODE_BUILD_LOCK_V3_20260822.md'
      - '.github/workflows/science-node-build-lock-v3.yml'
  workflow_dispatch:

concurrency:
  group: science-node-build-lock-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_science_node_build_lock_v3.py
