name: artifact-evidence-envelope-v1

on:
  pull_request:
    paths:
      - 'src/synergy_system/artifact_evidence_envelope_v1.py'
      - 'schemas/artifact_evidence_envelope_v1.schema.json'
      - 'fixtures/artifact_evidence_envelope_v1_examples.json'
      - 'tests/test_artifact_evidence_envelope_v1.py'
      - 'tests/test_artifact_evidence_envelope_schema_v1.py'
      - 'docs/ARTIFACT_EVIDENCE_ENVELOPE_V1_20260829.md'
      - '.github/workflows/artifact-evidence-envelope-v1.yml'
  workflow_dispatch:

jobs:
  envelope-contract-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_artifact_evidence_envelope_v1.py tests/test_artifact_evidence_envelope_schema_v1.py
