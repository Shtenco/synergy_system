name: economic-os-rc4-local-persistence-restart

on:
  pull_request:
    paths:
      - 'releases/economic_os_rc4_local_persistence_restart_20260828.json'
      - 'verify/verify_economic_os_rc4_local_persistence_restart.py'
      - 'tests/test_economic_os_rc4_local_persistence_restart.py'
      - 'docs/ECONOMIC_OS_RC4_LOCAL_PERSISTENCE_RESTART_20260828.md'
      - '.github/workflows/economic-os-rc4-local-persistence-restart.yml'
  workflow_dispatch:

jobs:
  rc4-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_os_rc4_local_persistence_restart.py
