name: SYNERGY M3 Federation E2E

on:
  workflow_dispatch:

jobs:
  m3:
    runs-on: ubuntu-latest
    env:
      FEDERATION_TOKEN: ${{ secrets.SYNERGY_FEDERATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: synergy_system
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Require federation token
        run: |
          test -n "$FEDERATION_TOKEN" || (echo "SYNERGY_FEDERATION_TOKEN required" && exit 1)
      - name: Checkout pinned federation
        env:
          GH_TOKEN: ${{ env.FEDERATION_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          lock=json.loads(Path("synergy_system/integration/m3_federation/integration_lock_v1.json").read_text())
          for item in lock["repositories"]:
              repo=item["repo"]; name=repo.split("/",1)[1]
              subprocess.run(["git","clone",f"https://x-access-token:{os.environ['GH_TOKEN']}@github.com/{repo}.git",name],check=True)
              subprocess.run(["git","checkout",item["commit"]],cwd=name,check=True)
          PY
      - name: Install Python test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic jsonschema
          if [ -f synergy_pay_system/pyproject.toml ] || [ -f synergy_pay_system/setup.py ]; then pip install -e ./synergy_pay_system; fi
          if [ -f synergy_ai_language/pyproject.toml ] || [ -f synergy_ai_language/setup.py ]; then pip install -e ./synergy_ai_language; fi
      - name: Run M3 semantic federation E2E
        env:
          SYNERGY_REPOS_ROOT: ${{ github.workspace }}
          SYNERGY_VERIFY_LOCK: "1"
        run: python synergy_system/integration/m3_federation/run.py
