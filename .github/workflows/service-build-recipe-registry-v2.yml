name: Science Node Service Build Recipe Registry v2

on:
  pull_request:
    paths:
      - 'config/service_build_recipe_registry_v2.json'
      - 'src/synergy_system/service_build_recipe_registry_v2.py'
      - 'schemas/synergy_service_build_recipe_registry_v2.schema.json'
      - 'config/cross_repo_schema_overlay_service_build_recipes_v2.json'
      - 'tests/test_service_build_recipe_registry_v2.py'
      - 'docs/SCIENCE_NODE_BUILD_RECIPE_REGISTRY_V2_20260822.md'
      - '.github/workflows/service-build-recipe-registry-v2.yml'
  workflow_dispatch:

concurrency:
  group: service-build-recipe-registry-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_science_node_build_lock_v3.py tests/test_service_build_recipe_registry_v2.py
