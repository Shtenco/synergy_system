name: economic-os-rc1-testnet-ready

on:
  pull_request:
    paths:
      - 'releases/economic_os_rc1_testnet_ready_20260828.json'
      - 'verify/verify_economic_os_rc1_testnet_ready.py'
      - 'tests/test_economic_os_rc1_testnet_ready.py'
      - 'docs/ECONOMIC_OS_RC1_TESTNET_READY_20260828.md'
      - '.github/workflows/economic-os-rc1-testnet-ready.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify/verify_economic_os_rc1_testnet_ready.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_os_rc1_testnet_ready.py
