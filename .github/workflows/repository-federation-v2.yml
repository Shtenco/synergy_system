name: Repository Federation v2

on:
  pull_request:
    paths:
      - "registry/repository_federation_v2_20260829.json"
      - "schemas/repository_federation_v2.schema.json"
      - "verify/verify_repository_federation_v2.py"
      - "tests/test_repository_federation_v2.py"
      - "docs/SYNERGY_PORTFOLIO_ROADMAP_TOP20_20260829.md"
      - ".github/workflows/repository-federation-v2.yml"
  push:
    branches:
      - main
    paths:
      - "registry/repository_federation_v2_20260829.json"
      - "schemas/repository_federation_v2.schema.json"
      - "verify/verify_repository_federation_v2.py"
      - "tests/test_repository_federation_v2.py"
      - "docs/SYNERGY_PORTFOLIO_ROADMAP_TOP20_20260829.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python verify/verify_repository_federation_v2.py
      - run: python -m pytest -q tests/test_repository_federation_v2.py
