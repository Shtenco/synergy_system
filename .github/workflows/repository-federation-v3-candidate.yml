name: repository-federation-v3-candidate

on:
  pull_request:
    paths:
      - 'registry/repository_federation_v3_candidate_20260905.json'
      - 'registry/repository_evidence_audit_v1_20260905.json'
      - 'schemas/repository_federation_v3_candidate.schema.json'
      - 'verify/verify_repository_federation_v3_candidate.py'
      - 'tests/test_repository_federation_v3_candidate.py'
      - '.github/workflows/repository-federation-v3-candidate.yml'
  push:
    branches:
      - feat/repository-federation-v3-candidate-20260905

jobs:
  federation-v3-candidate-selftest:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: python verify/verify_repository_federation_v3_candidate.py
      - run: python -m pytest -q tests/test_repository_federation_v3_candidate.py
      - run: python -m py_compile verify/verify_repository_federation_v3_candidate.py tests/test_repository_federation_v3_candidate.py
