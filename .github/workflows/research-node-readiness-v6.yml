name: Research Node Readiness v6

on:
  pull_request:
    paths:
      - 'evidence/research_compute_node_location_evidence_self_digest_negative_evidence_v1.json'
      - 'fixtures/artifact_location_evidence/*_v2.json'
      - 'fixtures/artifact_sets/*_v4.json'
      - 'fixtures/node_build_plans/*_v7.json'
      - 'fixtures/node_readiness/*_v6.json'
      - 'src/synergy_system/node_readiness_v6.py'
      - 'tests/test_node_readiness_v6.py'
      - '.github/workflows/research-node-readiness-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_node_readiness_v4.py tests/test_node_readiness_v5.py tests/test_node_readiness_v6.py
