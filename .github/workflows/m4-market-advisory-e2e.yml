name: SYNERGY M4 Market Advisory E2E

on:
  workflow_dispatch:

jobs:
  m4-market-advisory:
    runs-on: ubuntu-latest
    env:
      FEDERATION_TOKEN: ${{ secrets.SYNERGY_FEDERATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: synergy_system

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require federation token
        run: |
          test -n "$FEDERATION_TOKEN" || (echo "SYNERGY_FEDERATION_TOKEN required" && exit 1)

      - name: Checkout pinned M4 federation
        env:
          GH_TOKEN: ${{ env.FEDERATION_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          lock=json.loads(Path("synergy_system/integration/m4_market_advisory/integration_lock_v1.json").read_text())
          for item in lock["repositories"]:
              repo=item["repo"]
              name=repo.split("/",1)[1]
              subprocess.run(["git","clone",f"https://x-access-token:{os.environ['GH_TOKEN']}@github.com/{repo}.git",name],check=True)
              subprocess.run(["git","checkout",item["commit"]],cwd=name,check=True)
          PY

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest
          for d in synergy_marketvision synergy_adaptive_engine synergy_market_graph synergy_market_maker synergy_ai_investment_committee; do
            pip install -e "./$d"
          done

      - name: Run M4 market advisory E2E
        env:
          SYNERGY_REPOS_ROOT: ${{ github.workspace }}
          SYNERGY_VERIFY_LOCK: "1"
        run: python synergy_system/integration/m4_market_advisory/run.py

      - name: Verify M4 evidence
        run: python synergy_system/integration/m4_market_advisory/verify_evidence.py

      - name: Upload M4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-m4-market-advisory-evidence
          path: synergy_system/integration/m4_market_advisory/evidence/m4_market_advisory_result.json
          if-no-files-found: warn
