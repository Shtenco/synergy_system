name: Research Node Build Lock Policy v1

on:
  pull_request:
    paths:
      - 'config/research_node_build_lock_policy_v1.json'
      - 'tests/test_research_node_build_lock_policy_v1.py'
      - '.github/workflows/research-node-build-lock-policy-v1.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_research_node_build_lock_policy_v1.py
