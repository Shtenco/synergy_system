name: economic-os-canonical-merge-train-v1

on:
  pull_request:
    paths:
      - 'release_trains/economic_os_canonical_merge_train_v1.json'
      - 'verify/verify_economic_os_canonical_merge_train_v1.py'
      - 'tests/test_economic_os_canonical_merge_train_v1.py'
      - '.github/workflows/economic-os-canonical-merge-train-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify/verify_economic_os_canonical_merge_train_v1.py
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_os_canonical_merge_train_v1.py
