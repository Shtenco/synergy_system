name: Research Node Readiness v2

on:
  pull_request:
    paths:
      - 'fixtures/node_source_revisions/**'
      - 'fixtures/build_recipes/synergynet_build_recipe_v2.json'
      - 'fixtures/service_specs/content-cache_v2.json'
      - 'fixtures/service_specs/synergynet_v2.json'
      - 'fixtures/node_build_plans/research_compute_node_build_plan_runtime_services_v2.json'
      - 'fixtures/node_readiness/research_compute_node_readiness_v2.json'
      - 'src/synergy_system/node_readiness_v2.py'
      - 'schemas/synergy_node_source_revision_v1.schema.json'
      - 'schemas/synergy_node_build_plan_v2.schema.json'
      - 'schemas/synergy_node_readiness_v2.schema.json'
      - 'tests/test_research_node_readiness_v2.py'
      - 'config/cross_repo_schema_overlay_node_readiness_v2.json'
      - 'docs/RESEARCH_NODE_READINESS_V2.md'
      - '.github/workflows/research-node-readiness-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema pyyaml
      - run: python -m pip install -e .
      - run: pytest -q tests/test_research_node_readiness_v2.py
