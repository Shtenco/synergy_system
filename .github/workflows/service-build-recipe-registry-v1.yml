name: service-build-recipe-registry-v1

on:
  pull_request:
    paths:
      - 'config/service_build_recipe_registry_v1.json'
      - 'config/cross_repo_schema_overlay_service_build_recipes_v1.json'
      - 'schemas/synergy_service_build_recipe_registry_v1.schema.json'
      - 'src/synergy_system/service_build_recipe_registry_v1.py'
      - 'tests/test_service_build_recipe_registry_v1.py'
      - 'tests/test_service_build_recipe_schema_ownership_v1.py'
      - 'docs/SERVICE_BUILD_RECIPE_REGISTRY_V1.md'
      - '.github/workflows/service-build-recipe-registry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=src pytest -q tests/test_service_build_recipe_registry_v1.py tests/test_service_build_recipe_schema_ownership_v1.py
      - run: python -m json.tool config/service_build_recipe_registry_v1.json >/dev/null
      - run: python -m json.tool config/cross_repo_schema_overlay_service_build_recipes_v1.json >/dev/null
      - run: python -m json.tool schemas/synergy_service_build_recipe_registry_v1.schema.json >/dev/null
