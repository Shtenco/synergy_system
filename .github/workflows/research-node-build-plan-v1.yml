name: Research Node Build Plan v1

on:
  pull_request:
    paths:
      - 'fixtures/node_build_plans/research_compute_node_build_plan_source_candidate_v1.json'
      - 'fixtures/build_recipes/agi_nexus_build_recipe_v1.json'
      - 'fixtures/build_recipes/synergynet_build_recipe_v1.json'
      - 'src/synergy_system/node_build_plan_v1.py'
      - 'schemas/synergy_node_build_plan_v1.schema.json'
      - 'tests/test_research_node_build_plan_v1.py'
      - 'config/cross_repo_schema_overlay_node_build_plan_v1.json'
      - 'docs/RESEARCH_NODE_BUILD_PLAN_V1.md'
      - '.github/workflows/research-node-build-plan-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema pyyaml
      - run: python -m pip install -e .
      - run: pytest -q tests/test_research_node_build_plan_v1.py
