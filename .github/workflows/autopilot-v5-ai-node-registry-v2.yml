name: AUTOPILOT V5 AI Node Registry v2
on:
  pull_request:
    paths:
      - 'config/nodes/synergy_autopilot_v5_ai_node_v2.json'
      - 'src/synergy_system/autopilot_ai_node_registry_v2.py'
      - 'tests/test_autopilot_ai_node_registry_v2.py'
      - '.github/workflows/autopilot-v5-ai-node-registry-v2.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_autopilot_ai_node_registry_v2.py
