name: MetaPay DEX Print-Machine Convergence v1

on:
  pull_request:
    paths:
      - 'governance/metapay_dex_print_machine_convergence_v1.json'
      - 'verify/verify_metapay_dex_print_machine_convergence_v1.py'
      - 'tests/test_metapay_dex_print_machine_convergence_v1.py'
      - 'docs/METAPAY_DEX_PRINT_MACHINE_CONVERGENCE_V1_20260905.md'
      - 'docs/rag/SYNERGY_PROJECT_RAG_MEMORY_V2_1_20260905.manifest.json'
      - '.github/workflows/metapay-dex-print-machine-convergence-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Verify convergence policy
        run: python verify/verify_metapay_dex_print_machine_convergence_v1.py
      - name: Run adversarial tests
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py
      - name: Compile verifier
        run: python -m py_compile verify/verify_metapay_dex_print_machine_convergence_v1.py
