name: MetaPay DEX Print-Machine Convergence v1

on:
  pull_request:
    paths:
      - 'governance/metapay_dex_print_machine_convergence_v1.json'
      - 'verify/**'
      - 'tests/test_metapay_dex_print_machine_convergence_v1.py'
      - 'docs/METAPAY_DEX_PRINT_MACHINE_CONVERGENCE_V1_20260905.md'
      - 'docs/rag/SYNERGY_PROJECT_RAG_MEMORY_V2_1_20260905.manifest.json'
      - '.github/workflows/metapay-dex-print-machine-convergence-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Import verifier from repo
        run: python -c "from verify.verify_metapay_dex_print_machine_convergence_v1 import verify; print(verify.__name__)"
      - name: Compile verifier
        run: python -m py_compile verify/verify_metapay_dex_print_machine_convergence_v1.py
      - name: Verify canonical candidate policy
        run: python verify/verify_metapay_dex_print_machine_convergence_v1.py
      - name: Baseline policy test
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_policy_verifies
      - name: Internal value cannot become profit
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_cannot_relabel_internal_or_reallocated_value_as_profit
      - name: USD and USDT remain distinct
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_usd_and_usdt_cannot_be_collapsed
      - name: Synthetic FX is not executable
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_synthetic_fx_reference_cannot_become_executable_edge
      - name: Public P2P snapshot is not execution proof
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_public_p2p_snapshot_cannot_be_execution_proof
      - name: Print machine cannot self-promote
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_print_machine_cannot_be_promoted_to_value_source
      - name: Financial OS remains final classifier
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_financial_os_remains_final_classifier
      - name: AI payment authority cannot escalate
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_ai_payment_authority_cannot_escalate
      - name: Auto merge cannot be enabled
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py::test_auto_merge_cannot_be_enabled
      - name: Full adversarial regression
        run: pytest -q tests/test_metapay_dex_print_machine_convergence_v1.py
