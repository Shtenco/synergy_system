name: Live Economic Cycle Capture Readiness v2

on:
  pull_request:
    paths:
      - "src/synergy_system/live_economic_cycle_capture_v1.py"
      - "tests/test_live_economic_cycle_capture_v1.py"
      - "evidence/live_economic_cycle_capture_readiness_v2.json"
      - "verify/verify_live_economic_cycle_capture_readiness_v2.py"
      - "tests/test_live_economic_cycle_capture_readiness_v2.py"
      - "release_trains/economic_os_convergence_gate_map_v2_20260829.json"
      - ".github/workflows/live-economic-cycle-capture-readiness-v2.yml"
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_live_economic_cycle_capture_v1.py
      - run: python verify/verify_live_economic_cycle_capture_readiness_v2.py
      - run: python -m pytest -q tests/test_live_economic_cycle_capture_readiness_v2.py
