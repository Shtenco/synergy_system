[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-federation-contracts"
version = "0.1.0"
description = "Canonical typed contracts for SYNERGY Federation V3"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["contracts/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
