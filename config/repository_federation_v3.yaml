modernized_origin_rules:
  historical_mlm:
    keep: [network_effects, referrals_for_real_sales, franchise_templates, regional_distribution]
    reject: [recruitment_funded_returns, guaranteed_downline_income, participant_entry_as_revenue]
  historical_ai_uplift:
    status: SCENARIO_ONLY
    rule: quantify by controlled benchmark, causal test or live evidence
  historical_yield_targets:
    status: SCENARIO_ONLY
    rule: require costs, drawdown, capacity, OOS, shadow/live and settlement evidence
  historical_currency_backing:
    status: RND
    rule: separate unit_of_account, payment_asset, reserve_asset and risk_asset
  historical_science_claims:
    status: HYPOTHESIS
    rule: require falsification, reproducible experiment and independent evidence
  historical_system_growth:
    status: MODEL
    rule: use system_dynamics, saturation, capacity and stress scenarios rather than unconstrained exponential growth

status_vocabulary: [CANONICAL, CANDIDATE, RND, LEGACY, ARCHIVE, PRESENTATION, PLACEHOLDER]
verification_vocabulary: [CONCEPT, IMPLEMENTED, TESTS_PRESENT, RUNNER_EXECUTED, VERIFIED, SHADOW, LIVE_SETTLED, PRODUCTION_READY]
